name: Android Build (p4a + PySide6)

# 手动触发。首次运行预期失败并暴露问题（SDK/NDK 下载、p4a recipe、缺失 wheels），
# 属于迭代的一部分：失败日志与生成的 buildozer.spec 会随 artifact 上传，方便下一轮修正。
on:
  workflow_dispatch:
  push:
    branches:
      - feat/p4a-android

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # p4a / buildozer 需要 JDK 17（Qt 官方工具链对齐版本）
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
  # Qt 官方 android wheel 版本与架构（目标模拟器 x86_64 / API 35）
  PYSIDE_VERSION: 6.11.1
  P4A_ARCH: x86_64
  ANDROID_API: 35
  ANDROID_NDK: r27c

jobs:
  build-apk:
    name: build android x86_64 apk
    # 用 22.04：p4a/buildozer 与 libffi 的 autogen.sh 在 24.04 的
    # libtool 2.4.7 下会报 LT_SYS_SYMBOL_USCORE 未定义（24.04 移除该宏），
    # 22.04（autoconf 2.71 + libtool 2.4.6）是 buildozer 官方 CI 验证环境。
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # ---- 系统依赖：p4a / buildozer / Qt 工具链的常规依赖 ----
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            openjdk-17-jdk-headless \
            build-essential \
            ccache \
            autoconf automake libtool \
            zlib1g-dev libffi-dev libssl-dev \
            pkg-config \
            ninja-build \
            wget unzip zip curl \
            python3-venv python3-pip \
            git
          java -version

      # ---- Rust 工具链：pydantic-core 的 p4a recipe（RustCompiledComponentsRecipe）需要 ----
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # ---- 宿主 Python：pyside6-android-deploy 要求宿主 Python <= 3.11 ----
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache p4a venv wheels / buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: p4a-pip-${{ env.PYSIDE_VERSION }}
          restore-keys: |
            p4a-pip-

      - name: Install PySide6 desktop + pyside6-android-deploy + buildozer
        run: |
          python3 -m pip install --upgrade pip
          # 桌面版 PySide6 自带 pyside6-android-deploy 控制台脚本
          python3 -m pip install "PySide6==$PYSIDE_VERSION"
          python3 -m pip install buildozer==1.5.0 cython==0.29.33 meson
          # pyside6-android-deploy 运行时依赖（jinja2/pkginfo/tqdm/packaging==24.1），
          # 官方要求从对应 requirements-android.txt 安装精确版本
          python3 -m pyside6_android_deploy --help >/dev/null 2>&1 || true
          req="/opt/hostedtoolcache/Python/3.11.15/x64/lib/python3.11/site-packages/PySide6/scripts/requirements-android.txt"
          # 用 python 定位（路径可能因 setup-python 版本而变）
          REQ_PATH=$(python3 -c "import PySide6.scripts, pathlib; p=pathlib.Path(PySide6.scripts.__file__).parent/'requirements-android.txt'; print(p)")
          python3 -m pip install -r "$REQ_PATH"
          which pyside6-android-deploy

      # ---- 下载 PySide6 官方 android x86_64 wheel（cp311）----
      - name: Cache PySide6 android wheels
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/wheels
          key: wheels-pyside-${{ env.PYSIDE_VERSION }}-${{ env.P4A_ARCH }}

      - name: Download PySide6 android wheels
        if: ${{ hashFiles(format('{0}/wheels/*.whl', runner.temp)) == '' || runner.os != 'Linux' }}
        run: |
          mkdir -p "$RUNNER_TEMP/wheels"
          base=https://download.qt.io/official_releases/QtForPython
          # download.qt.io 会 302 到镜像，SSL 偶发断连：加大重试/超时
          dl() {
            curl -fL --retry 8 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 --max-time 900 \
              --speed-limit 1024 --speed-time 60 -o "$1" "$2"
          }
          dl "$RUNNER_TEMP/wheels/pyside6.whl" \
            "$base/pyside6/pyside6-$PYSIDE_VERSION-$PYSIDE_VERSION-cp311-cp311-android_$P4A_ARCH.whl"
          dl "$RUNNER_TEMP/wheels/shiboken6.whl" \
            "$base/shiboken6/shiboken6-$PYSIDE_VERSION-$PYSIDE_VERSION-cp311-cp311-android_$P4A_ARCH.whl"
          ls -lh "$RUNNER_TEMP/wheels"

      # ---- Android SDK + NDK：预装并缓存（NDK 路径与 Qt 工具缓存一致）----
      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.home }}/.pyside6_android_deploy/android-ndk/android-ndk-${{ env.ANDROID_NDK }}
          key: ndk-${{ env.ANDROID_NDK }}-${{ env.ANDROID_API }}
          restore-keys: |
            ndk-${{ env.ANDROID_NDK }}-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.home }}/android-sdk
          key: sdk-${{ env.ANDROID_API }}
          restore-keys: |
            sdk-

      - name: Install Android NDK
        run: |
          ndk_root="$HOME/.pyside6_android_deploy/android-ndk"
          ndk_dir="$ndk_root/android-ndk-$ANDROID_NDK"
          if [ ! -d "$ndk_dir" ]; then
            mkdir -p "$ndk_root"
            echo "Downloading Android NDK $ANDROID_NDK"
            curl -fL -o "$RUNNER_TEMP/ndk.zip" \
              "https://dl.google.com/android/repository/android-ndk-$ANDROID_NDK-linux.zip"
            unzip -q "$RUNNER_TEMP/ndk.zip" -d "$ndk_root"
          fi
          test -f "$ndk_dir/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"

      - name: Install Android SDK (cmdline-tools + platform/build-tools)
        run: |
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            curl -fL -o "$RUNNER_TEMP/clt.zip" \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q "$RUNNER_TEMP/clt.zip" -d "$ANDROID_SDK_ROOT/cmdline-tools"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" \
               "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-$ANDROID_API" \
            "build-tools;35.0.0"
          test -f "$ANDROID_SDK_ROOT/platforms/android-$ANDROID_API/android.jar"
          # 说明：不给 buildozer 提供 legacy tools/bin/sdkmanager 软链是有意为之——
          # pass1（pyside6-android-deploy）内部的 buildozer 会因找不到 sdkmanager
          # 快速失败，从而保留其生成的已补丁 buildozer.spec / recipes / jars；
          # buildozer 软链在 pass2 直接构建前才补上（见下方 Build APK 步骤）。

      # ---- 准备干净的应用目录（不含 .git/.venv/构建缓存）----
      - name: Prepare app build directory
        run: |
          app_dir="$RUNNER_TEMP/iaa-app"
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude '.ruff_cache' \
            --exclude '.pytest_cache' \
            --exclude '.buildozer' \
            --exclude 'deployment' \
            --exclude 'build' \
            --exclude 'dist' \
            --exclude 'dumps*' \
            --exclude 'logs' \
            --exclude 'conf' \
            "$GITHUB_WORKSPACE/" "$app_dir/"
          cd "$app_dir"
          # 官方工具若发现 buildozer.spec 已存在会跳过自动配置：把仓库骨架挪开，
          # 让工具先生成一份完整的 Qt 配置（含 recipes 引用、--qt-libs、jars）。
          mv buildozer.spec buildozer.spec.sample
          echo "app_dir=$app_dir" >> "$GITHUB_ENV"

      # ---- 第一次 deploy：生成 buildozer.spec + 动态 recipes（构建可能失败，属预期）----
      - name: Generate buildozer.spec via pyside6-android-deploy (pass 1)
        working-directory: ${{ env.app_dir }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          # 失败也继续：生成的 buildozer.spec / deployment/ 会被下一步补丁复用
          pyside6-android-deploy \
            --wheel-pyside="$RUNNER_TEMP/wheels/pyside6.whl" \
            --wheel-shiboken="$RUNNER_TEMP/wheels/shiboken6.whl" \
            --ndk-path="$HOME/.pyside6_android_deploy/android-ndk/android-ndk-$ANDROID_NDK" \
            --sdk-path="$HOME/android-sdk" \
            --keep-deployment-files \
            --force \
            --name iaa \
            --verbose \
            -c pysidedeploy.spec || true
          ls -la buildozer.spec && grep -n '^requirements' buildozer.spec || echo "buildozer.spec missing"

      # ---- 补丁：把仓库的 Android 依赖与构建参数并入工具生成的 spec ----
      - name: Merge iaa requirements into generated buildozer.spec
        working-directory: ${{ env.app_dir }}
        run: |
          python3 - <<'PY'
          import configparser, pathlib, re, sys

          spec = pathlib.Path('buildozer.spec')
          if not spec.exists():
              # 工具在生成 spec 之前就失败了 —— 上报日志，交给下一次迭代排查
              print('::warning::buildozer.spec was not generated; nothing to patch')
              sys.exit(0)

          # 读取 p4a.txt 里“额外”依赖（纯 Python 显式全量 + pydantic-core recipe）
          extra = []
          for line in pathlib.Path('requirements/p4a.txt').read_text(encoding='utf-8').splitlines():
              line = line.strip()
              if not line or line.startswith('#'):
                  continue
              extra.append(line)

          base = 'python3==3.11.9,hostpython3==3.11.9,shiboken6,PySide6'
          requirements = base + ',' + ','.join(extra)

          cp = configparser.ConfigParser(
              comment_prefixes='#', inline_comment_prefixes=None, interpolation=None)
          cp.read(spec, encoding='utf-8')
          app = cp['app']
          app['requirements'] = requirements
          # 硬编码段（与仓库 buildozer.spec 骨架一致）
          app['android.accept_sdk_license'] = 'True'
          app['android.wakelock'] = 'True'
          app['android.api'] = '35'
          app['android.minapi'] = '24'
          app['android.ndk_api'] = '24'
          app['android.permissions'] = 'INTERNET'
          app['title'] = 'iaa'
          app['version'] = '26.07b1'
          # 仓库版本号 '26.07b1' 非数值点分格式，Android 需要显式 versionCode
          app['android.numeric_version'] = '2607'
          # 工具生成的 include_exts 缺 ttf/txt（QML FontLoader 需要 ttf 进包）
          cur_exts = app.get('source.include_exts', 'py,png,jpg,qml,js')
          app['source.include_exts'] = cur_exts + ',ttf,txt'

          # 【启动崩溃修复】--qt-libs 顺序必须保证 Qt6Core 在最前。
          # 背景：JVM 只对 System.load 显式加载的库调用 JNI_OnLoad；被 dlopen 拉入的
          # 依赖库不会触发。QJniEnvironment::getJniEnv() 依赖 libQt6Core 的 JNI_OnLoad
          # 注册全局 JavaVM(g_javaVM，见 qtbase qjnihelpers.cpp)。若 Qt6Quick 先加载，
          # 其 JNI_OnLoad 里 getJniEnv() 会因 g_javaVM 为空而 SIGSEGV。
          # pyside6-android-deploy 用 list(set(...)) 生成 --qt-libs，顺序随机，
          # 因此这里强制把 Core 排到首位。详见 notes/05-root-cause-jni.md。
          extra_args = app.get('p4a.extra_args', '')
          m = re.match(r'(.*--qt-libs=)([^ ]+)(.*)', extra_args)
          if m:
              modules = m.group(2).split(',')
              reordered = ['Core'] + [x for x in modules if x != 'Core']
              app['p4a.extra_args'] = (
                  m.group(1) + ','.join(reordered) + m.group(3))
              print('reordered --qt-libs =', ','.join(reordered))
          else:
              print('::warning::--qt-libs not found in p4a.extra_args')
          with spec.open('w', encoding='utf-8') as f:
              cp.write(f, space_around_delimiters=True)
          print('patched requirements =', requirements)
          PY

      - name: Show merged buildozer.spec
        working-directory: ${{ env.app_dir }}
        run: |
          grep -E '^(requirements|p4a\.|android\.|title|version|source)' buildozer.spec | head -40

      # ---- 第二次：直接用 buildozer 用补丁后的 spec 完整构建 ----
      # pyside6-android-deploy 打印 "File buildozer.spec created, ready to customize!"
      # 意味着它只负责生成 spec/recipes；再跑一次 --force 会 cleanup() 掉补丁后的 spec
      # （见 pyside-tools/android_deploy.py 的 cleanup()）。因此此处直接调
      # buildozer android debug，按补丁后的 requirements 构建。
      - name: Build APK via buildozer (pass 2)
        working-directory: ${{ env.app_dir }}
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.buildozer/android/platform/apache-ant-1.9.4/bin:$PATH"
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          # buildozer 的 _sdkmanager 只认传统路径 $SDK/tools/bin/sdkmanager
          # （buildozer/targets/android.py 的 sdkmanager_path property）；
          # cmdline-tools 装出来的是 cmdline-tools/latest/bin，pass1 刻意不给以免
          # 其内部 buildozer 白白跑完整构建，这里补上供这次直接构建使用。
          mkdir -p "$HOME/android-sdk/tools/bin"
          ln -sf "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" \
                 "$HOME/android-sdk/tools/bin/sdkmanager"
          buildozer -v android debug
          # 收集产物
          mkdir -p "$RUNNER_TEMP/artifacts"
          find "$HOME/.buildozer" "$PWD/.buildozer" -name '*.apk' 2>/dev/null | while read -r f; do
            cp -f "$f" "$RUNNER_TEMP/artifacts/" && echo "copied: $f"
          done
          cp -f *.apk "$RUNNER_TEMP/artifacts/" 2>/dev/null || true
          echo "=== artifacts ==="
          ls -lh "$RUNNER_TEMP/artifacts"

      # ---- 无论成败都上传产物与日志，方便下一轮迭代 ----
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iaa-android-${{ env.P4A_ARCH }}
          path: ${{ runner.temp }}/artifacts/*.apk
          if-no-files-found: warn

      - name: Upload build logs and spec
        uses: actions/upload-artifact@v4
        with:
          name: iaa-android-logs
          path: |
            ${{ env.app_dir }}/buildozer.spec
            ${{ env.app_dir }}/.buildozer/buildozer.log
            ${{ env.app_dir }}/deployment/**
          if-no-files-found: warn