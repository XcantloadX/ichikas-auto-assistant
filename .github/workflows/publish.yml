name: Publish

# 一次触发产出全部发布物：wheel（PyPI）+ launcher（GitHub Release 附件）。
# 两个发布目标都可在手动触发时取消勾选，方便只构建、只发其一。
on:
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: '发布 wheel 到 PyPI'
        type: boolean
        default: true
      publish_release:
        description: '创建 GitHub Release（草稿，附 launcher zip）'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # 构建必须在 Windows 上：wheel 内含 win 专用二进制，资源生成工具也按 Windows 行为编写；
  # 启动器同样只在 Windows 上构建（产物是 .exe）。
  build:
    name: Build wheel + launcher
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      launcher_version: ${{ steps.launcher-version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # 版本号取自最新 tag，需要完整 tag 列表；启动器源码是 submodule，
          # 不拉取则 bootstrap/LmmPyLauncher 为空目录
          fetch-depth: 0
          submodules: recursive

      # 版本号唯一来源是最新 git tag：先按 tag 生成 iaa/__meta__.py，
      # pyproject.toml 的 dynamic version 依赖它，uv sync 缺它会直接报
      # ModuleNotFoundError: No module named 'iaa'（见 e057998 的教训）。
      # 该步骤用系统 python 跑（纯 stdlib），不依赖 uv。
      - name: Write version from tag
        run: python tools/release_notes.py write-meta

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --group dev

      - name: Clean __pycache__
        run: uv run python -c "import pathlib, shutil; [shutil.rmtree(p) for p in pathlib.Path('iaa').rglob('__pycache__')]"

      - name: Generate resources
        run: uv run ./tools/make_resources.py -p

      - name: Build wheel
        run: uv build --wheel

      # 与 wheel 元数据、release tag 保持一致（同一 tag 推导）
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = python tools/release_notes.py version
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version" -Encoding utf8
          Write-Host "version=$version"

      # 启动器版本独立于 iaa（取自 bootstrap/LmmPyLauncher/Cargo.toml），
      # 决定附件名 launcher.v<ver>.zip；iaa 升版本时它通常不变
      - name: Read launcher version
        id: launcher-version
        shell: pwsh
        run: |
          $version = python tools/release_notes.py launcher-version
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version" -Encoding utf8
          Write-Host "launcher version=$version"

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          # 工作区在 submodule 内，默认按仓库根查找会缓存不到 target
          workspaces: bootstrap/LmmPyLauncher -> target

      - name: Build launcher
        shell: pwsh
        env:
          # build.rs 通过 cargo:rustc-env 把配置路径编译进二进制，必须是绝对路径
          LMM_LAUNCHER_JSON: ${{ github.workspace }}\bootstrap\launcher\launcher.json
        run: |
          cargo build --release --bins --manifest-path bootstrap/LmmPyLauncher/Cargo.toml
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item bootstrap/LmmPyLauncher/target/release/LmmPyLauncher.exe dist/iaa.exe -Force
          Copy-Item bootstrap/LmmPyLauncher/target/release/LmmPyLauncherCli.exe dist/iaa-cli.exe -Force

      - name: Package launcher
        shell: pwsh
        run: |
          # zip 名带启动器版本，不带 iaa 版本：两者独立演进
          $zip = "dist/launcher.v${{ steps.launcher-version.outputs.version }}.zip"
          Compress-Archive -Path dist/iaa.exe, dist/iaa-cli.exe -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Select-Object Name, @{n = 'SizeMB'; e = { [math]::Round($_.Length / 1MB, 1) } }

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

      - name: Upload launcher
        uses: actions/upload-artifact@v4
        with:
          name: launcher
          path: dist/launcher.v*.zip
          if-no-files-found: error

  # 发布到 PyPI 必须在 Linux 上：pypa/gh-action-pypi-publish 是 Docker action，
  # 在非 GNU/Linux 环境会直接 "This action is only able to run under GNU/Linux environments" 并 exit 1。
  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: inputs.publish_pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # Release 说明文本复用 tools/release_notes.py：CHANGELOG 对应段落 + 完整历史 + 下载说明
  release:
    name: Draft GitHub release
    needs: build
    if: inputs.publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # release_notes.py 需要 tag 与提交历史来生成「完整历史」一节
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          # 不指定 name/pattern：本工作流只有 wheel 与 launcher 两个 artifact，全量下载即可。
          # 两者解到同一目录，一个 release 同时附 zip 与 wheel——wheel 方便访问不了
          # PyPI 时手动安装，也让 release 自成完整归档。
          path: dist
          merge-multiple: true

      - name: Generate release body
        env:
          LAUNCHER_VERSION: ${{ needs.build.outputs.launcher_version }}
        run: |
          python tools/release_notes.py body \
            --output "$RUNNER_TEMP/release-body.md" \
            --launcher-version "$LAUNCHER_VERSION"

      - name: Ensure release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; tag a new version or delete the old release first." >&2
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
          LAUNCHER_VERSION: ${{ needs.build.outputs.launcher_version }}
        run: |
          gh release create "$TAG" \
            "dist/launcher.v${LAUNCHER_VERSION}.zip" \
            dist/*.whl \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-body.md"
