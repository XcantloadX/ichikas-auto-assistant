name: Publish to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --group dev

      - name: Clean __pycache__
        run: uv run python -c "import pathlib, shutil; [shutil.rmtree(p) for p in pathlib.Path('iaa').rglob('__pycache__')]"

      - name: Generate resources
        run: uv run ./tools/make_resources.py -p

      - name: Build wheel
        run: uv build --wheel

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
