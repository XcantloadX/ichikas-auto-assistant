[project]
name = "ichikas-auto-assistant"
description = """
Ichika's Auto Assistant is a helper script
for Project Sekai: Colorful Stage
that automates dailies.
"""
readme = "README.md"
requires-python = "~=3.10.0"
license = "GPL-3.0-only"
license-files = ["LICENSE.md"]
authors = [
    { name = "XcantloadX" },
]
dynamic = ["version"]
dependencies = [
    "kotonebot[android]==0.21.0",
    "grpcio",
    "numpy<2.0",
    "onnxruntime==1.14.0 ; sys_platform == 'win32' or sys_platform == 'linux'",
    "onnxruntime ; sys_platform != 'win32'",
    "psutil",
    "PySide6",
    "pydantic",
    "pynput",
    "requests",
    "sentry-sdk",
    "thefuzz>=0.22.1",
    "plyer>=2.1.0",
    "click",
    "opencv-python==4.10.0.84 ; sys_platform == 'win32'",
    # PyPI 上的 av 14.3.0 是空发布（无任何文件），取最近的 14.2.0
    "av==14.2.0 ; sys_platform == 'win32'",
]

[project.scripts]
iaa = "iaa.application.cli.index:main"

[project.urls]
Homepage = "https://github.com/XcantloadX/ichikas-auto-assistant"
Repository = "https://github.com/XcantloadX/ichikas-auto-assistant"
Changelog = "https://github.com/XcantloadX/ichikas-auto-assistant/blob/main/doc/CHANGELOG.md"

[dependency-groups]
dev = [
    "kotonebot[dev]",
    "ruff",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "iaa.__meta__.__VERSION__" }

[tool.setuptools.packages.find]
include = ["iaa*"]

[tool.setuptools.package-data]
iaa = ["assets/*", "assets/*/*", "assets/*/*/*", "res/*"]
"iaa.application.qt" = ["qml/*", "qml/*/*", "qml/*/*/*"]

[tool.setuptools.exclude-package-data]
iaa = ["res/__pycache__/*", "assets/__pycache__/*"]
"iaa.application.qt" = ["qml/__pycache__/*", "qml/*/__pycache__/*", "qml/*/*/__pycache__/*"]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
]

[tool.ruff.format]
quote-style = "single"

[tool.kotonebot.editor]
prefabs_module = "iaa.game_ui.elements"
resource_path = "resources/"

[tool.kotonebot.variant]
variants = ["tw", "cn", "en"]
base = "jp"
path_pattern = "nest"
